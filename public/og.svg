<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BayJF — AI Native Developer · AI Agent Delivery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12354f"/>
      <stop offset="55%" stop-color="#0d2233"/>
      <stop offset="100%" stop-color="#08131d"/>
    </linearGradient>
    <linearGradient id="bayInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="120" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="520" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- Brand row: mark + wordmark -->
  <g transform="translate(80, 56)">
    <rect width="56" height="56" rx="12" fill="#0a1826"/>
    <rect x="0.5" y="0.5" width="55" height="55" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <g transform="translate(10, 10) scale(1.125)" fill="none" stroke="url(#bayInk)" stroke-width="2.8" stroke-linecap="round">
      <path d="M11.5 6.5 C 11 13, 11 19, 10 22.6 C 9.2 25.4, 5.6 26.2, 4.4 24"/>
      <path d="M11.3 9.5 C 16.5 7.3, 22.5 7.5, 27.3 9.8"/>
      <path d="M11.2 15 C 15.5 13.6, 20 13.8, 23.8 15.6" opacity="0.55"/>
    </g>
    <text x="72" y="37" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#7dd3fc">BAYJF · PORTFOLIO</text>
  </g>

  <!-- Main title -->
  <text x="80" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="86" font-weight="800" letter-spacing="-1.5" fill="#fbf9f7">AI Native</text>
  <text x="80" y="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="86" font-weight="800" letter-spacing="-1.5" fill="url(#bayInk)">AI Agent Delivery</text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" fill="#b8c4cc">Turning AI Agent ideas into practical products</text>
  <text x="80" y="490" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" fill="#b8c4cc">and measurable efficiency gains — end to end.</text>

  <!-- Bottom row: tagline + URL -->
  <rect x="80" y="540" width="6" height="40" fill="#38bdf8"/>
  <text x="100" y="568" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#9db9c9">Jiang Feng · Shenzhen · Remote / Global</text>
  <text x="1120" y="568" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#7dd3fc">bayjf.com</text>
</svg>
