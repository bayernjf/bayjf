<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BayJF — AI Native Developer · AI Agent Delivery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="55%" stop-color="#1b1c1b"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bbcac2"/>
      <stop offset="100%" stop-color="#54615b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54615b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#54615b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#54615b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="120" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="520" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- Top bar: brand -->
  <text x="80" y="100" font-family="Montserrat, Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#bbcac2">BAYJF · PORTFOLIO</text>

  <!-- Main title -->
  <text x="80" y="260" font-family="Montserrat, Inter, sans-serif" font-size="86" font-weight="800" fill="#fbf9f7">AI Native</text>
  <text x="80" y="360" font-family="Montserrat, Inter, sans-serif" font-size="86" font-weight="800" fill="url(#accent)">AI Agent Delivery</text>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#c4c7c7">Turning AI Agent ideas into practical products</text>
  <text x="80" y="470" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#c4c7c7">and measurable efficiency gains — end to end.</text>

  <!-- Bottom row: tagline + URL -->
  <rect x="80" y="540" width="6" height="40" fill="#bbcac2"/>
  <text x="100" y="568" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#bbcac2">Jiang Feng · Shenzhen · Remote / Global</text>
  <text x="1120" y="568" text-anchor="end" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#bbcac2">bayjf.pages.dev</text>
</svg>
